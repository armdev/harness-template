[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "haytarar-common"
version = "0.1.0"
description = "Shared code for haytarar services: signed service calls, logging, telemetry."
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.2",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
]

[tool.setuptools]
packages = ["common"]
