# air-harness — the compose file is the architecture: services, identities, who may call whom, database roles.
# `make up` starts the stack; `make harness-fast` checks this file (topology sensor) before anything runs.
#
# Portal:                         browser -> web -> gateway (signed as web; the gateway API is public)
# Call graph (signed, Ed25519):   gateway -> content, gateway -> search, gateway -> notify, gateway -> graph,
#                                 gateway -> chat -> search, graph, content (retrieval), chat -> LLM (OpenAI-compatible)
# Events (Kafka):                 content --content.post.created--> search, notify, graph
# Data:                           postgres (content_svc, search_svc, notify_svc), neo4j (graph), kafka — under DATA_DIR

name: air-harness

x-harness:                                  # read by harness/sensors/topology_check.py, ignored by compose
  alerts: infra/prometheus/alerts.yml       # T7: every application service has alert rules here
  env_example: .env.example                 # T8: every ${VAR} used below is documented here

x-py: &py                                   # every Python service: same runtime contract
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &py-env
    LOG_LEVEL: ${LOG_LEVEL:-INFO}           # root log level of every Python service
    KEYS_DIR: /run/keys
  depends_on:                               # an explicit depends_on in a service REPLACES this one
    service-keys: { condition: service_completed_successfully }

x-internal: &internal                       # reachable only inside the compose network
  expose: ["8000"]

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-air_harness}     # application database name

services:
  # ------------------------------------------------------------------ one-shots
  storage-init:                             # prepares DATA_DIR subdirectories with the owners the images expect
    image: busybox:${BUSYBOX_TAG:-1.37}     # busybox image tag
    command: ["sh", "-c", "mkdir -p /data/postgres /data/kafka /data/neo4j && chown -R 1000:1000 /data/kafka"]
    volumes:
      - ${DATA_DIR:-/var/tmp/air-harness}:/data  # persistent data root, outside the repository

  service-keys:                             # one Ed25519 identity per service; append new services to the list
    build: { context: ., dockerfile: libs/common/Dockerfile }
    image: air-harness/service-keys:${APP_TAG:-dev}   # tag of locally built application images
    user: "0:0"                             # chowns each private key to the service uid (10001)
    entrypoint: ["python", "-m", "common.keygen", "/keys", "gateway", "content", "search", "notify", "graph", "web", "chat"]
    volumes:
      - service-keys:/keys

  migrate:                                  # Flyway: the only writer of schema; services own no DDL
    image: flyway/flyway:${FLYWAY_TAG:-11.12-alpine}   # Flyway image tag
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-air_harness}
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_PLACEHOLDERS_CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:-content-dev}
      FLYWAY_PLACEHOLDERS_SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD:-search-dev}
      FLYWAY_PLACEHOLDERS_NOTIFY_DB_PASSWORD: ${NOTIFY_DB_PASSWORD:-notify-dev}
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres: { condition: service_healthy }

  kafka-init:                               # topics are created here and nowhere else (auto-create is off)
    image: apache/kafka:${KAFKA_TAG:-3.9.1}  # Kafka image tag (broker and CLI)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for spec in $$TOPICS; do
          name=$${spec%%:*}; parts=$${spec##*:}
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$name" --partitions "$$parts" --replication-factor 1
        done
    environment:
      TOPICS: >-
        content.post.created:3
    depends_on:
      kafka: { condition: service_healthy }

  graph-init:                               # graph schema (db/graph/*.cypher): the Neo4j counterpart of migrate
    image: neo4j:${NEO4J_TAG:-5.26.12-community}   # Neo4j image tag (server and cypher-shell)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /graph/*.cypher; do
          echo "applying $$f"
          cypher-shell -a bolt://neo4j:7687 -u neo4j -p "$$NEO4J_PASSWORD" -f "$$f"
        done
    environment:
      NEO4J_PASSWORD: ${GRAPH_DB_PASSWORD:-graph-dev}
    volumes:
      - ./db/graph:/graph:ro
    depends_on:
      neo4j: { condition: service_healthy }

  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:${POSTGRES_TAG:-17.6-alpine}   # PostgreSQL image tag
    restart: unless-stopped
    environment:
      <<: *db-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}   # superuser; used only by migrate
    volumes:
      - ${DATA_DIR:-/var/tmp/air-harness}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      storage-init: { condition: service_completed_successfully }

  kafka:
    image: apache/kafka:${KAFKA_TAG:-3.9.1}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms256m}   # broker JVM heap
    volumes:
      - ${DATA_DIR:-/var/tmp/air-harness}/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    depends_on:
      storage-init: { condition: service_completed_successfully }

  neo4j:                                    # graph store of the graph service; nothing else connects to it
    image: neo4j:${NEO4J_TAG:-5.26.12-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${GRAPH_DB_PASSWORD:-graph-dev}   # password of the graph store (8+ characters)
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}   # Neo4j JVM heap
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - ${DATA_DIR:-/var/tmp/air-harness}/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      storage-init: { condition: service_completed_successfully }

  # ------------------------------------------------------------------ application
  gateway:                                  # public API; no data of its own
    <<: [*py, *internal]
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    image: air-harness/gateway:${APP_TAG:-dev}
    ports: ["${GATEWAY_PORT:-8080}:8000"]   # host port of the public API
    environment:
      <<: *py-env
      SERVICE_NAME: gateway
      CONTENT_URL: http://content:8000
      SEARCH_URL: http://search:8000
      NOTIFY_URL: http://notify:8000
      GRAPH_URL: http://graph:8000
      CHAT_URL: http://chat:8000
    volumes:
      - { type: volume, source: service-keys, target: /run/keys/self, read_only: true, volume: { subpath: gateway } }
      - { type: volume, source: service-keys, target: /run/keys/public, read_only: true, volume: { subpath: public } }
    depends_on:
      service-keys: { condition: service_completed_successfully }
      content: { condition: service_healthy }
      search: { condition: service_healthy }
      notify: { condition: service_healthy }
      graph: { condition: service_healthy }
      chat: { condition: service_healthy }

  content:                                  # owns posts; publishes content.post.created
    <<: [*py, *internal]
    build: { context: ., dockerfile: services/content/Dockerfile }
    image: air-harness/content:${APP_TAG:-dev}
    environment:
      <<: *py-env
      SERVICE_NAME: content
      TRUSTED_CALLERS: gateway,chat
      DB_DSN: postgresql://content_svc:${CONTENT_DB_PASSWORD:-content-dev}@postgres:5432/${POSTGRES_DB:-air_harness}
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - { type: volume, source: service-keys, target: /run/keys/self, read_only: true, volume: { subpath: content } }
      - { type: volume, source: service-keys, target: /run/keys/public, read_only: true, volume: { subpath: public } }
    depends_on:
      service-keys: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  search:                                   # full-text search; indexes content.post.created
    <<: [*py, *internal]
    build: { context: ., dockerfile: services/search/Dockerfile }
    image: air-harness/search:${APP_TAG:-dev}
    environment:
      <<: *py-env
      SERVICE_NAME: search
      TRUSTED_CALLERS: gateway,chat
      DB_DSN: postgresql://search_svc:${SEARCH_DB_PASSWORD:-search-dev}@postgres:5432/${POSTGRES_DB:-air_harness}
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - { type: volume, source: service-keys, target: /run/keys/self, read_only: true, volume: { subpath: search } }
      - { type: volume, source: service-keys, target: /run/keys/public, read_only: true, volume: { subpath: public } }
    depends_on:
      service-keys: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  notify:                                   # records a notification for every new post (stand-in for e-mail)
    <<: [*py, *internal]
    build: { context: ., dockerfile: services/notify/Dockerfile }
    image: air-harness/notify:${APP_TAG:-dev}
    environment:
      <<: *py-env
      SERVICE_NAME: notify
      TRUSTED_CALLERS: gateway
      DB_DSN: postgresql://notify_svc:${NOTIFY_DB_PASSWORD:-notify-dev}@postgres:5432/${POSTGRES_DB:-air_harness}
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - { type: volume, source: service-keys, target: /run/keys/self, read_only: true, volume: { subpath: notify } }
      - { type: volume, source: service-keys, target: /run/keys/public, read_only: true, volume: { subpath: public } }
    depends_on:
      service-keys: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  graph:                                    # knowledge graph of posts, authors and tags; consumes content.post.created
    <<: [*py, *internal]
    build: { context: ., dockerfile: services/graph/Dockerfile }
    image: air-harness/graph:${APP_TAG:-dev}
    environment:
      <<: *py-env
      SERVICE_NAME: graph
      TRUSTED_CALLERS: gateway,chat
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${GRAPH_DB_PASSWORD:-graph-dev}
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - { type: volume, source: service-keys, target: /run/keys/self, read_only: true, volume: { subpath: graph } }
      - { type: volume, source: service-keys, target: /run/keys/public, read_only: true, volume: { subpath: public } }
    depends_on:
      service-keys: { condition: service_completed_successfully }
      graph-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  chat:                                     # answers questions: search -> graph -> content -> LLM, streamed (SSE)
    <<: [*py, *internal]
    build: { context: ., dockerfile: services/chat/Dockerfile }
    image: air-harness/chat:${APP_TAG:-dev}
    environment:
      <<: *py-env
      SERVICE_NAME: chat
      TRUSTED_CALLERS: gateway
      SEARCH_URL: http://search:8000
      GRAPH_URL: http://graph:8000
      CONTENT_URL: http://content:8000
      CHAT_LLM_URL: ${CHAT_LLM_URL-http://ollama:11434/v1}    # OpenAI-compatible model endpoint; set empty = answer with the sources only
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}                     # model name at that endpoint
      CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY:-not-needed}       # API key for a hosted endpoint
    extra_hosts: ["host.docker.internal:host-gateway"]     # a model served on this machine (e.g. a native Ollama)
    volumes:
      - { type: volume, source: service-keys, target: /run/keys/self, read_only: true, volume: { subpath: chat } }
      - { type: volume, source: service-keys, target: /run/keys/public, read_only: true, volume: { subpath: public } }
    depends_on:
      service-keys: { condition: service_completed_successfully }
      content: { condition: service_healthy }
      search: { condition: service_healthy }
      graph: { condition: service_healthy }

  web:                                      # rag-web: the portal (browser client); forwards /api/* to the gateway, signed
    <<: [*py, *internal]
    build: { context: ., dockerfile: services/web/Dockerfile }
    image: air-harness/web:${APP_TAG:-dev}
    ports: ["${WEB_PORT:-8081}:8000"]       # host port of the web portal
    environment:
      <<: *py-env
      SERVICE_NAME: web
      GATEWAY_URL: http://gateway:8000      # the public API; calls are signed as `web` like every service call
    volumes:
      - { type: volume, source: service-keys, target: /run/keys/self, read_only: true, volume: { subpath: web } }
    depends_on:
      service-keys: { condition: service_completed_successfully }
      gateway: { condition: service_healthy }

  # ------------------------------------------------------------------ optional profiles
  prometheus:                               # make up-observability
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.6.0}   # Prometheus image tag (also used by the prom-rules sensor)
    profiles: [observability]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]   # host port of the Prometheus UI
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro

  ollama:                                   # local OpenAI-compatible LLM for the review agent: make llm
    image: ollama/ollama:${OLLAMA_TAG:-0.12.3}   # Ollama image tag
    profiles: [local-llm]
    ports: ["${OLLAMA_PORT:-11434}:11434"]   # host port of the local LLM API
    volumes:
      - ${DATA_DIR:-/var/tmp/air-harness}/ollama:/root/.ollama

  contract:                                 # the specification: make contract (stack must be up)
    build: { context: ., dockerfile: tools/Dockerfile }
    image: air-harness/tools:${APP_TAG:-dev}
    profiles: [tools]
    working_dir: /repo
    command: ["pytest", "-q", "-p", "no:cacheprovider", "contract"]
    environment:
      GATEWAY_URL: http://gateway:8000
      CONTENT_URL: http://content:8000      # used only to prove unsigned calls are rejected
      WEB_URL: http://web:8000              # the portal: serves the client, forwards /api/* to the gateway
    volumes:
      - ./contract:/repo/contract:ro

  unit:                                     # unit tests of libs/ and services/: make test
    build: { context: ., dockerfile: tools/Dockerfile }
    image: air-harness/tools:${APP_TAG:-dev}
    profiles: [tools]
    working_dir: /repo
    command: ["pytest", "-q", "-p", "no:cacheprovider", "libs/common/tests"]
    environment:
      PYTHONPATH: /repo/libs/common         # test the mounted source, not the copy baked into the image
    volumes:
      - ./libs:/repo/libs:ro
    network_mode: none

  seed:                                     # load a dataset of posts through the API: ./app.sh seed bank (stack up)
    build: { context: ., dockerfile: tools/Dockerfile }
    image: air-harness/tools:${APP_TAG:-dev}
    profiles: [tools]
    working_dir: /repo
    entrypoint: ["python", "tools/seed.py"]
    command: ["general"]
    environment:
      GATEWAY_URL: http://gateway:8000
      DATASETS_DIR: /repo/datasets
    volumes:
      - ./tools/seed.py:/repo/tools/seed.py:ro
      - ./services/web/static/datasets:/repo/datasets:ro

  eval:                                     # search quality: make eval (stack must be up)
    build: { context: ., dockerfile: tools/Dockerfile }
    image: air-harness/tools:${APP_TAG:-dev}
    profiles: [tools]
    user: "${HARNESS_UID:-1000}:${HARNESS_GID:-1000}"
    working_dir: /repo
    command: ["python", "eval/run_eval.py"]
    environment:
      GATEWAY_URL: http://gateway:8000
      EVAL_OUT: /out
      EVAL_TOLERANCE: ${EVAL_TOLERANCE:-0.05}   # allowed metric drop against eval/baseline.json
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}       # OpenAI-compatible endpoint for the LLM judge; empty = skip judge
      JUDGE_MODEL: ${JUDGE_MODEL:-qwen3:8b}     # model used by the judge
      JUDGE_API_KEY: ${JUDGE_API_KEY:-not-needed}   # API key for the judge endpoint
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./eval:/repo/eval:ro
      - ./harness/prompts:/repo/harness/prompts:ro
      - ./.harness:/out

volumes:
  service-keys:
