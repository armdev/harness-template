global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8000"] }]
  - job_name: content
    static_configs: [{ targets: ["content:8000"] }]
  - job_name: search
    static_configs: [{ targets: ["search:8000"] }]
  - job_name: notify
    static_configs: [{ targets: ["notify:8000"] }]
