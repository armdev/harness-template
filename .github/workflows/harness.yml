name: harness

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"          # nightly: continuous stage (dead code, vulnerable dependencies)
  workflow_dispatch:

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MIGRATIONS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Host plane prerequisites
        run: |
          pip install pyyaml==6.0.3
          echo "DATA_DIR=$RUNNER_TEMP/air-harness-data" >> "$GITHUB_ENV"   # persistent data outside the checkout

      - name: Build runner image
        run: make harness-build

      - name: The harness tests itself
        run: |
          make harness-test
          make harness-coverage
          make harness-selftest
          make adoption-test

      - name: Static sensors (blocking)
        run: make harness-static

      - name: Continuous stage (nightly only, advisory)
        if: github.event_name == 'schedule'
        run: |
          make harness-selftest-live
          make harness-continuous

      - name: Run the product end to end (stack, smoke test, all stages, URLs)
        if: github.event_name != 'schedule'
        run: ./run.sh --full

      - name: Web console smoke test (serves state and proxies the running API)
        if: github.event_name != 'schedule'
        run: |
          python3 harness/console/server.py > "$RUNNER_TEMP/console.log" 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8090/api/state > /dev/null
          curl -fsS http://127.0.0.1:8090/gw/openapi.json | grep -q '"/api/posts"'

      - name: The application alone (exported without the harness, started, contract suite)
        if: github.event_name != 'schedule'
        run: |
          ./run.sh --down
          ./app.sh export "$RUNNER_TEMP/rag-app"
          for p in harness harness.yaml harness.mk compose.harness.yml AGENTS.md; do
            test ! -e "$RUNNER_TEMP/rag-app/$p" || { echo "export contains $p"; exit 1; }
          done
          cd "$RUNNER_TEMP/rag-app"
          ./app.sh up
          ./app.sh test
          ./app.sh seed bank | tee "$RUNNER_TEMP/seed1.txt"
          grep -q "100 posts created" "$RUNNER_TEMP/seed1.txt"
          ./app.sh seed bank > "$RUNNER_TEMP/seed2.txt"
          grep -q "0 posts created, 100 already there" "$RUNNER_TEMP/seed2.txt"   # idempotent
          curl -fsS -N http://localhost:8081/api/chat -H 'content-type: application/json' \
               -d '{"messages":[{"role":"user","content":"What is the difference between APR and the interest rate?"}]}' \
               > "$RUNNER_TEMP/chat.txt"
          grep -q "Interest rate versus APR" "$RUNNER_TEMP/chat.txt"             # retrieval finds the banking post
          ./app.sh seed ibank > "$RUNNER_TEMP/seed3.txt"
          grep -q "46 posts created" "$RUNNER_TEMP/seed3.txt"
          ./app.sh seed planner > "$RUNNER_TEMP/seed4.txt"
          grep -q "11 employees, 61 tasks, 57 meetings" "$RUNNER_TEMP/seed4.txt"
          curl -fsS http://localhost:8081/api/planner/plan/anna.petrosyan > "$RUNNER_TEMP/plan.txt"
          grep -q '"key":"PAY-101"' "$RUNNER_TEMP/plan.txt"                     # the blocker is planned

      - name: Report
        if: always()
        run: |
          [ -f .harness/report.md ] && cat .harness/report.md >> "$GITHUB_STEP_SUMMARY" || true
          [ -f .harness/eval-report.md ] && cat .harness/eval-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report
          path: .harness/
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: make clean
