# Harness manifest — the harness as data, not as folklore.
# One file declares every guide (feedforward) and sensor (feedback), where it runs and when.
# `harness coverage` reads it to show gaps; `harness run` executes it; `harness selftest` proves sensors can fire.
harness: 1
template:
  name: py-services-pg-kafka          # the topology this harness regulates (variety reduction)
  version: 0.2.0                      # projects pin this; upgrades arrive as a new runner image + manifest diff

categories: [maintainability, architecture, behaviour]

# Planes: where a sensor executes.
#   static — harness container, network_mode: none, repo mounted read-only (hermetic, fast)
#   live   — harness container on the project network (needs the LLM or the running stack)
#   host   — the developer machine / CI agent, through make and docker compose
# Stages: when it runs (keep quality left). pre-commit < integration < pipeline < continuous.
# Sensor output convention: one finding per line starting with ERROR or WARN, then indented `what:` / `fix:`.

guides:
  - id: agents-md
    path: AGENTS.md
    kind: inferential
    category: [maintainability, architecture, behaviour]
  - id: skill-new-service
    path: harness/skills/new-service/SKILL.md
    kind: inferential
    category: [architecture]
  - id: skill-new-endpoint
    path: harness/skills/new-endpoint/SKILL.md
    kind: inferential
    category: [behaviour, architecture]
  - id: skill-db-migration
    path: harness/skills/db-migration/SKILL.md
    kind: inferential
    category: [architecture]
  - id: skill-new-topic
    path: harness/skills/new-topic/SKILL.md
    kind: inferential
    category: [architecture]
  - id: skill-harness-report         # how to act on the report: the loop the agent lives in
    path: harness/skills/harness-report/SKILL.md
    kind: inferential
    category: [maintainability, architecture, behaviour]
  - id: skill-harness-steer          # for the humans (and agents) who maintain the harness itself
    path: harness/skills/harness-steer/SKILL.md
    kind: inferential
    category: [maintainability]
  - id: prompts                       # system prompts of inferential sensors + agent task templates
    path: harness/prompts
    kind: inferential
    category: [maintainability, behaviour]
  - id: review-rubric                 # one rubric, read by the coding agent (forward) and the reviewer (back)
    path: harness/review/RUBRIC.md
    kind: inferential
    category: [maintainability, behaviour]
  - id: semgrep-rules                 # rule messages double as instructions
    path: harness/rules/semgrep
    kind: computational
    category: [architecture, maintainability]
  - id: contract-readme
    path: contract/README.md
    kind: inferential
    category: [behaviour]
  - id: eval-readme
    path: eval/README.md
    kind: inferential
    category: [behaviour]

sensors:
  - id: topology
    kind: computational
    category: architecture
    plane: static
    stages: [pre-commit, pipeline]
    blocking: true
    run: python harness/sensors/topology_check.py docker-compose.yml
    pairs_with: [skill-new-service, skill-new-topic, agents-md]
    fix_hint: Each finding names the compose key to change. Fix compose, not code, unless the finding says otherwise.
    selftest:
      fixtures: harness/sensors/fixtures/topology
      run: python harness/sensors/topology_check.py --strict {fixture}

  - id: migrations
    kind: computational
    category: architecture
    plane: static
    stages: [pre-commit, pipeline]
    blocking: true
    run: python harness/sensors/migrations_check.py db/migrations
    pairs_with: [skill-db-migration, agents-md]
    fix_hint: Migrations are append-only history. Never edit a committed V-file; add V<next>__<name>.sql with its GRANTs.
    selftest:
      fixtures: harness/sensors/fixtures/migrations
      run: MIGRATIONS_BASE=none python harness/sensors/migrations_check.py --strict {fixture}

  - id: ruff
    kind: computational
    category: maintainability
    plane: static
    stages: [pre-commit, pipeline]
    blocking: true
    run: ruff check --output-format=concise services libs contract eval
    pairs_with: [agents-md]
    fix_hint: Run `ruff check --fix` for autofixable rules; do not add noqa without a reason in the same line.
    selftest:
      fixtures: harness/sensors/fixtures/ruff
      run: ruff check --no-cache --output-format=concise {fixture}

  - id: semgrep-local
    kind: computational
    category: architecture
    plane: static
    stages: [pre-commit, pipeline]
    blocking: true
    run: semgrep scan --config harness/rules/semgrep --error --metrics=off --disable-version-check --quiet --emacs services libs
    pairs_with: [semgrep-rules, skill-new-service]
    selftest:
      fixtures: harness/sensors/fixtures/semgrep/services   # under services/ so path-scoped rules apply
      run: semgrep scan --config harness/rules/semgrep --error --metrics=off --disable-version-check --quiet --emacs {fixture}
    fix_hint: Each rule message states the allowed alternative. Never silence with nosemgrep in services/.

  - id: review-agent
    kind: inferential
    category: maintainability
    plane: live
    stages: [pre-commit]
    blocking: false                   # inferential sensors advise until their precision is measured
    run: python harness/sensors/review.py
    pairs_with: [review-rubric, prompts]
    fix_hint: Address ERROR findings or reply in the commit message why the finding is wrong (feeds the rubric).

  - id: unit
    kind: computational
    category: behaviour
    plane: host
    stages: [integration, pipeline]
    blocking: true
    run: make -s test
    pairs_with: [agents-md]
    fix_hint: Unit tests live next to the code (libs/common/tests). Fix the code; change a test only with the behaviour.

  - id: contract
    kind: computational
    category: behaviour
    plane: host
    stages: [integration, pipeline]
    blocking: true
    run: make -s contract
    pairs_with: [contract-readme, skill-new-endpoint, agents-md]
    fix_hint: The contract suite is the spec. Change the implementation; change a contract test only when the user asked for new behaviour.

  - id: eval
    kind: inferential                 # IR metrics are computational; the judge (JUDGE_*) is inferential
    category: behaviour
    plane: host
    stages: [pipeline]
    blocking: false                   # becomes blocking once a baseline and tolerance are agreed
    run: make -s eval
    pairs_with: [eval-readme, prompts]
    fix_hint: Read .harness/eval-report.md (weakest queries first); explain any metric drop in the PR or revert the ranking change.

  - id: prom-rules
    kind: computational
    category: architecture
    plane: host
    stages: [pipeline]
    blocking: true
    run: docker run --rm -v "$PWD/infra/prometheus:/p:ro" --entrypoint promtool prom/prometheus:${PROMETHEUS_TAG:-v3.6.0} check rules /p/alerts.yml
    pairs_with: [skill-new-service]
    fix_hint: Alert rules are code; every new service needs its up/latency/error rules (topology T7 checks presence, promtool syntax).

  - id: dead-code
    kind: computational
    category: maintainability
    plane: static
    stages: [continuous]
    blocking: false
    run: vulture services libs harness/rules/vulture_whitelist.py --min-confidence 80
    pairs_with: [agents-md]
    fix_hint: Delete it or whitelist it in harness/rules/vulture_whitelist.py with the reason.
    selftest:
      fixtures: harness/sensors/fixtures/vulture
      run: vulture --min-confidence 60 {fixture}

  - id: deps-audit
    kind: computational
    category: maintainability
    plane: live                       # needs the vulnerability database
    stages: [continuous]
    blocking: false
    run: >-
      sh -c 'rc=0; for f in $(find services libs tools -name "requirements*.txt"); do
      pip-audit --progress-spinner off -r "$f" || rc=1; done; exit $rc'
    pairs_with: [agents-md]
    fix_hint: Bump the pinned version; if no fix exists, record the accepted risk with an expiry date.
